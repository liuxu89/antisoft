name: Validate digest and extract source
on:
  push:
    branches: [codex/digest-social-acceleration]
concurrency:
  group: digest-preparation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download public paper
        timeout-minutes: 2
        run: curl --fail --location --connect-timeout 15 --max-time 75 'https://acceleratedclassroom.wordpress.com/wp-content/uploads/2011/03/social-acceleration.pdf' --output /tmp/social-acceleration.pdf
      - name: Prepare extraction tools
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Extract with MinerU
        timeout-minutes: 1
        continue-on-error: true
        run: |
          npm install --global mineru-open-api
          mineru-open-api flash-extract /tmp/social-acceleration.pdf --pages 1-15 -o /tmp/source_p1-15.md
      - name: Read complete paper text
        if: always()
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader('/tmp/social-acceleration.pdf')
          print('TOTAL_PAGES:', len(reader.pages))
          for number, page in enumerate(reader.pages, 1):
              print(f'=== PDF PAGE {number} ===')
              print(page.extract_text(extraction_mode='layout'))
          PY
