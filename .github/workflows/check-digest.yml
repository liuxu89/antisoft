name: Validate digest and extract source
on:
  push:
    branches: [codex/digest-social-acceleration]
concurrency:
  group: digest-preparation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download public paper
        timeout-minutes: 2
        run: curl --fail --location --connect-timeout 15 --max-time 75 'https://acceleratedclassroom.wordpress.com/wp-content/uploads/2011/03/social-acceleration.pdf' --output /tmp/social-acceleration.pdf
      - name: Render original figures for verification
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          python - <<'PY'
          import pymupdf, base64, json
          doc = pymupdf.open('/tmp/social-acceleration.pdf')
          for page_number in [2, 10, 22, 24]:
              pix = doc[page_number - 1].get_pixmap(matrix=pymupdf.Matrix(1.2, 1.2))
              encoded = base64.b64encode(pix.tobytes('jpeg', jpg_quality=65)).decode()
              print('FIGURE_JSON:' + json.dumps({'page': page_number, 'base64': encoded}))
          PY
