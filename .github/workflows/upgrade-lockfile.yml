name: Prepare Node 24 upgrade
on:
  push:
    branches: [codex/node24-vitepress2]
    paths:
      - .github/workflows/upgrade-lockfile.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/node24-vitepress2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean installation
        run: npm ci
      - name: Build documentation
        run: npm run docs:build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate npm lockfile for VitePress 2"
            git push origin HEAD:codex/node24-vitepress2
          fi
